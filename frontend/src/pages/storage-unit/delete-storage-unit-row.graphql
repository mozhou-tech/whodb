mutation DeleteRow($ref: SourceObjectRefInput!, $values: [RecordInput!]!) {
  DeleteRow: DeleteSourceRow(ref: $ref, values: $values) {
    Status
  }
}

mutation ClearSourceObjectData($ref: SourceObjectRefInput!) {
  ClearSourceObjectData(ref: $ref) {
    Status
  }
}

mutation DropSourceObject($ref: SourceObjectRefInput!) {
  DropSourceObject(ref: $ref) {
    Status
  }
}

