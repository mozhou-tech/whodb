query FlywayStatus {
  FlywayStatus {
    Installed
    Version
    BinaryPath
    InstallMethod
  }
}

query InspectFlywayDirectory($directory: String!) {
  InspectFlywayDirectory(directory: $directory) {
    Directory
    Exists
    Error
    Files {
      Filename
      RelativePath
      Version
      Description
      Type
      SizeBytes
    }
  }
}

mutation InstallFlyway {
  InstallFlyway {
    Success
    Output
    Error
    Status {
      Installed
      Version
      BinaryPath
      InstallMethod
    }
  }
}

mutation ExecuteFlyway($input: ExecuteFlywayInput!) {
  ExecuteFlyway(input: $input) {
    Success
    Action
    Command
    Output
    Error
    DurationMs
  }
}

query SourceMigrationDiagnosis($input: SourceMigrationInput!) {
  SourceMigrationDiagnosis(input: $input) {
    Healthy
    RepairAllowed
    Token
    Error
    Issues {
      Version
      Script
      Code
      Message
      SQL
      Recovery {
        Safe
        Matched
        Pending
        Error
        Steps {
          DuplicateDataAvailable
          Kind
          Object
          Status
          Reason
          SQL
        }
      }
    }
  }
}

mutation RepairSourceMigrations($input: SourceMigrationRepairInput!) {
  RepairSourceMigrations(input: $input) {
    Success
    Error
    Steps {
      Success
      Action
      Command
      Output
      Error
      DurationMs
    }
  }
}

query SourceMigrationDuplicateRows($input: SourceMigrationInput!, $version: String!, $object: String!) {
 SourceMigrationDuplicateRows(input: $input, version: $version, object: $object) {
  Columns { Name }
  Rows
 }
}

query SourceMigrationDuplicateCleanupPreview($input: SourceMigrationInput!, $version: String!, $object: String!, $strategy: SourceDuplicateRetentionStrategy!) {
 SourceMigrationDuplicateCleanupPreview(input: $input, version: $version, object: $object, strategy: $strategy) {
  Groups RowsToDelete Deleted PrimaryKeyColumns Fingerprint
 }
}
mutation SourceCleanMigrationDuplicates($input: SourceMigrationInput!, $version: String!, $object: String!, $strategy: SourceDuplicateRetentionStrategy!, $fingerprint: String!) {
 SourceCleanMigrationDuplicates(input: $input, version: $version, object: $object, strategy: $strategy, fingerprint: $fingerprint) {
  Groups RowsToDelete Deleted PrimaryKeyColumns Fingerprint
 }
}
