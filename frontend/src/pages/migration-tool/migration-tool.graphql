query FlywayStatus {
  FlywayStatus {
    Installed
    Version
    BinaryPath
    InstallMethod
  }
}

query InspectFlywayDirectory($directory: String!) {
  InspectFlywayDirectory(directory: $directory) {
    Directory
    Exists
    Error
    Files {
      Filename
      RelativePath
      Version
      Description
      Type
      SizeBytes
    }
  }
}

mutation InstallFlyway {
  InstallFlyway {
    Success
    Output
    Error
    Status {
      Installed
      Version
      BinaryPath
      InstallMethod
    }
  }
}

mutation ExecuteFlyway($input: ExecuteFlywayInput!) {
  ExecuteFlyway(input: $input) {
    Success
    Action
    Command
    Output
    Error
    DurationMs
  }
}

query SourceMigrationDiagnosis($input: SourceMigrationInput!) {
  SourceMigrationDiagnosis(input: $input) {
    Healthy
    RepairAllowed
    Token
    Error
    Issues {
      Version
      Script
      Code
      Message
      SQL
      Recovery {
        Safe
        Matched
        Pending
        Error
        Steps {
          Kind
          Object
          Status
          Reason
          SQL
        }
      }
    }
  }
}

mutation RepairSourceMigrations($input: SourceMigrationRepairInput!) {
  RepairSourceMigrations(input: $input) {
    Success
    Error
    Steps {
      Success
      Action
      Command
      Output
      Error
      DurationMs
    }
  }
}
