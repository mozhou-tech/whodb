query RawExecute($query: String!) {
  RawExecute: RunSourceQuery(query: $query) {
      Columns {
          Type
          Name
          Comment
          MetadataFidelity
          IsPrimary
          IsForeignKey
          ReferencedTable
          ReferencedColumn
          Length
          Precision
          Scale
      }
      Rows
      DisableUpdate
      TotalCount
	}
}
